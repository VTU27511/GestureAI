services:
  # Python FastAPI Backend
  - type: web
    name: gestureai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: ALLOWED_ORIGINS
        value: "*"

  # React Frontend Website
  - type: static_site
    name: gestureai-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
